version: "3.9"

services:
  backend:
    build: .
    container_name: resume-analyzer-backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: resume_analyzer
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama (local LLM) access ke liye

  db:
    image: mysql:8.0
    container_name: resume-analyzer-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: resume_analyzer
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: